name: Build README

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Twice a day, at a minute that is not :00 so the run is not queued behind
    # the top-of-hour rush on GitHub's shared runners.
    - cron: "37 5,17 * * *"

permissions:
  contents: write

concurrency:
  group: build-readme
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fill the auto-generated README regions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python build_readme.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- README.md; then
            echo "README.md unchanged, nothing to commit"
            exit 0
          fi
          git add README.md
          git commit -m "Update README with latest releases and activity"
          git push
